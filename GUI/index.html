<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    :root {
      --ink: #4f315c;
      --muted: #7f6b82;
      --line: rgba(79, 49, 92, .27);
      --paper: rgba(255, 252, 246, .72);
      --violet: #8d70d5;
      --coral: #e98c82;
    }

    * { box-sizing: border-box; }
    *, *::before, *::after { cursor: default !important; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink);
      font-family: "Avenir Next", Avenir, Optima, "Gill Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      background: #faf6ee;
    }

    button, select { font: inherit; color: inherit; }
    button:focus, select:focus { outline: none; }

    #app {
      position: relative;
      width: 869px;
      height: 652px;
      transform-origin: top left;
      background: url("vocalify_background.png") center / 100% 100% no-repeat;
    }

    .pitch-panel {
      position: absolute;
      left: 38px;
      top: 143px;
      width: 132px;
      height: 300px;
    }

    .section-title {
      margin: 0;
      font-family: Optima, "Avenir Next", sans-serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: .06em;
    }

    .waterline {
      display: block;
      width: 62px;
      height: 13px;
      margin-top: 4px;
    }

    .pitch-value {
      position: absolute;
      left: 91px;
      top: -2px;
      width: 66px;
      height: 25px;
      padding: 2px 0 0;
      border: 0;
      background: transparent;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .slider-shell {
      position: absolute;
      left: 43px;
      top: 47px;
      width: 92px;
      height: 196px;
      touch-action: none;
      outline: none;
    }

    .slider-track {
      position: absolute;
      left: 0;
      top: 8px;
      width: 12px;
      height: 180px;
      pointer-events: none;
      filter: drop-shadow(0 2px 2px rgba(60,34,71,.14));
    }

    .slider-thumb {
      position: absolute;
      left: -7px;
      top: 90px;
      width: 26px;
      height: 16px;
      pointer-events: none;
      filter: drop-shadow(0 3px 3px rgba(57,38,65,.25));
      transform: translateY(-50%);
    }

    .ticks {
      position: absolute;
      left: 23px;
      top: 8px;
      width: 66px;
      height: 180px;
      pointer-events: none;
    }

    .tick {
      position: absolute;
      left: 0;
      height: 1px;
      width: 7px;
      background: rgba(79,49,92,.38);
      transform: translateY(-.5px);
    }
    .tick.medium { width: 11px; background: rgba(79,49,92,.45); }
    .tick.major { width: 17px; background: rgba(79,49,92,.55); }
    .tick-label {
      position: absolute;
      left: 34px;
      width: 35px;
      transform: translateY(-50%);
      font-size: 11px;
      font-weight: 500;
      color: #59415f;
    }

    .pitch-hint {
      position: absolute;
      left: 11px;
      top: 257px;
      width: 118px;
      color: rgba(79,49,92,.64);
      text-align: center;
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .session-panel {
      position: absolute;
      left: 704px;
      top: 143px;
      width: 135px;
    }

    .session-panel .waterline { margin-bottom: 24px; }
    .control-label {
      margin: 18px 0 8px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .action {
      width: 132px;
      height: 38px;
      border: 1px solid rgba(79,49,92,.27);
      border-radius: 19px;
      background: rgba(255,253,248,.72);
      box-shadow: 0 5px 15px rgba(69,43,76,.07);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      transition: .15s ease;
    }
    .action:hover { background: rgba(255,255,255,.92); transform: translateY(-1px); }
    .action.active {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(100deg, rgba(142,113,213,.84), rgba(232,140,131,.82));
    }
    .action:disabled { opacity: .42; transform: none; }

    .status-card {
      width: 132px;
      min-height: 86px;
      margin-top: 22px;
      padding: 12px 11px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(255,252,246,.32);
      font-size: 9.5px;
      line-height: 1.55;
      color: var(--muted);
    }
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 6px;
      border-radius: 50%;
      background: #b9aeb9;
    }
    .status-dot.live { background: #68bca9; box-shadow: 0 0 0 3px rgba(104,188,169,.13); }

    .stream-card {
      width: 132px;
      min-height: 118px;
      padding: 16px 11px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(255,252,246,.32);
      color: var(--muted);
      font-size: 9.5px;
      line-height: 1.55;
    }
    .stream-title {
      margin-bottom: 10px;
      color: var(--ink);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
    }
    .stream-hint { margin-top: 12px; opacity: .78; }

    .bottom-bar {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 17px;
      height: 47px;
    }

    .bypass {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 122px;
      height: 36px;
      border: 1px solid rgba(79,49,92,.25);
      border-radius: 19px;
      background: rgba(255,253,248,.64);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
    }
    .bypass::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 8px;
      border-radius: 50%;
      background: #b8aab9;
    }
    .bypass.on::before { background: #8f70dc; box-shadow: 0 0 0 3px rgba(143,112,220,.12); }

    .model-wrap {
      position: absolute;
      left: 284px;
      bottom: 0;
      width: 340px;
      height: 46px;
      padding: 5px 18px 5px 70px;
      border: 1px solid rgba(79,49,92,.24);
      border-radius: 24px;
      background: rgba(255,253,248,.70);
      box-shadow: 0 5px 18px rgba(64,39,72,.06);
    }
    .model-wrap::before {
      content: "VOICE";
      position: absolute;
      left: 22px;
      top: 16px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .12em;
      color: var(--muted);
    }
    #modelSelect {
      width: 100%;
      height: 34px;
      padding: 0 28px 0 10px;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 11px;
      font-weight: 500;
      text-overflow: ellipsis;
    }

    .render-badge {
      position: absolute;
      right: 0;
      bottom: 8px;
      max-width: 180px;
      overflow: hidden;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .03em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wave { fill: none; stroke-linecap: round; stroke-width: 1.2; }
  </style>
</head>
<body>
  <main id="app">
    <section class="pitch-panel" aria-label="Pitch control">
      <h2 class="section-title">PITCH</h2>
      <svg class="waterline" viewBox="0 0 62 13" aria-hidden="true">
        <path class="wave" stroke="#7051a6" d="M1 9 C10 8, 13 2, 22 4 S34 11, 43 6 S53 4, 61 6"/>
        <path class="wave" stroke="#75a9d8" opacity=".75" d="M34 6 C42 3, 50 9, 61 5"/>
      </svg>
      <output id="pitchValue" class="pitch-value">0.00 st</output>
      <div id="pitchSlider" class="slider-shell" role="slider"
           aria-label="Pitch in semitones" aria-valuemin="-24" aria-valuemax="24" aria-valuenow="0">
        <img class="slider-track" src="pitch_slider_track.png" alt="">
        <img id="pitchThumb" class="slider-thumb" src="pitch_slider_thumb.png" alt="">
        <div id="ticks" class="ticks"></div>
      </div>
      <div class="pitch-hint">semitones</div>
    </section>

    <section class="session-panel">
      <h2 class="section-title">SESSION</h2>
      <svg class="waterline" viewBox="0 0 62 13" aria-hidden="true">
        <path class="wave" stroke="#db8b83" d="M1 8 C8 3, 15 11, 22 5 S35 2, 42 7 S52 9, 61 4"/>
        <path class="wave" stroke="#e8bd67" opacity=".8" d="M35 7 C43 3, 52 8, 61 5"/>
      </svg>
      <div class="control-label">Live conversion</div>
      <div class="stream-card">
        <div class="stream-title"><span id="statusDot" class="status-dot"></span>STREAM</div>
        <div id="streamStatus">Loading RVC model</div>
        <div class="stream-hint">Turn RVC on, then press play in your DAW.</div>
      </div>
    </section>

    <footer class="bottom-bar">
      <button id="bypassButton" class="bypass" type="button">BYPASS</button>
      <label class="model-wrap">
        <select id="modelSelect" aria-label="Voice model"><option>Loading models…</option></select>
      </label>
      <div id="renderBadge" class="render-badge">RVC READY</div>
    </footer>
  </main>

  <script>
    (() => {
      const app = document.getElementById('app');
      const slider = document.getElementById('pitchSlider');
      const thumb = document.getElementById('pitchThumb');
      const valueLabel = document.getElementById('pitchValue');
      const ticks = document.getElementById('ticks');
      const modelSelect = document.getElementById('modelSelect');
      const bypassButton = document.getElementById('bypassButton');
      let pitch = 0;
      let dragging = false;
      let modelSignature = '';

      const send = (event, value = {}) => {
        if (window.__JUCE__?.backend) window.__JUCE__.backend.emitEvent(event, value);
      };

      const releaseKeyboardFocus = () => {
        if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
        send('releaseKeyboardFocus');
      };

      const resize = () => {
        const scale = Math.min(innerWidth / 869, innerHeight / 652);
        app.style.transform = `scale(${scale})`;
        document.body.style.width = `${869 * scale}px`;
        document.body.style.height = `${652 * scale}px`;
      };

      const setPitch = (next, notify = false) => {
        pitch = Math.max(-24, Math.min(24, Math.round(next)));
        const y = 8 + ((24 - pitch) / 48) * 180;
        thumb.style.top = `${y}px`;
        valueLabel.textContent = `${pitch > 0 ? '+' : ''}${pitch.toFixed(2)} st`;
        slider.setAttribute('aria-valuenow', pitch);
        if (notify) send('setPitch', pitch);
      };

      const pitchFromPointer = (event) => {
        const bounds = slider.getBoundingClientRect();
        const scale = bounds.height / 196;
        const localY = (event.clientY - bounds.top) / scale;
        return 24 - ((Math.max(8, Math.min(188, localY)) - 8) / 180) * 48;
      };

      for (let value = 24; value >= -24; value -= 2) {
        const y = ((24 - value) / 48) * 180;
        const tick = document.createElement('span');
        tick.className = `tick ${value % 12 === 0 ? 'major' : value % 6 === 0 ? 'medium' : ''}`;
        tick.style.top = `${y}px`;
        ticks.appendChild(tick);
        if (value % 12 === 0) {
          const label = document.createElement('span');
          label.className = 'tick-label';
          label.style.top = `${y}px`;
          label.textContent = value > 0 ? `+${value}` : `${value}`;
          ticks.appendChild(label);
        }
      }

      slider.addEventListener('pointerdown', event => {
        dragging = true;
        slider.setPointerCapture(event.pointerId);
        setPitch(pitchFromPointer(event), true);
      });
      slider.addEventListener('pointermove', event => {
        if (dragging) setPitch(pitchFromPointer(event), true);
      });
      slider.addEventListener('pointerup', () => { dragging = false; });
      slider.addEventListener('pointercancel', () => { dragging = false; });

      modelSelect.addEventListener('change', () => {
        send('selectModel', Number(modelSelect.value));
        releaseKeyboardFocus();
      });
      bypassButton.addEventListener('click', () => {
        send('togglePower', !bypassButton.classList.contains('on'));
        releaseKeyboardFocus();
      });

      window.addEventListener('pointerup', event => {
        if (event.target !== modelSelect) releaseKeyboardFocus();
      }, true);

      const updateState = state => {
        if (!dragging) setPitch(Number(state.pitch || 0));
        bypassButton.classList.toggle('on', Boolean(state.enabled));
        bypassButton.textContent = state.enabled ? 'RVC ON' : 'BYPASS';
        document.getElementById('streamStatus').textContent = state.engineStatus || 'Streaming engine idle';
        document.getElementById('statusDot').classList.toggle('live', Boolean(state.enabled && (state.modelLoaded || state.vocalDetected)));
        document.getElementById('renderBadge').textContent = state.engineStatus || 'RVC READY';

        const signature = JSON.stringify(state.models || []);
        if (signature !== modelSignature) {
          modelSignature = signature;
          modelSelect.innerHTML = '';
          (state.models || []).forEach((name, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = name;
            modelSelect.appendChild(option);
          });
          if (!state.models?.length) {
            const option = document.createElement('option');
            option.textContent = 'No models found';
            modelSelect.appendChild(option);
          }
        }
        modelSelect.value = String(state.selectedModel || 0);
      };

      window.addEventListener('resize', resize);
      resize();
      setPitch(0);
      if (window.__JUCE__?.backend) {
        window.__JUCE__.backend.addEventListener('uiState', updateState);
        send('requestState');
      }
    })();
  </script>
</body>
</html>
